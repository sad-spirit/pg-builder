name: "Static Analysis"

on:
  pull_request:
  push:
    branches:
      - master
      - 2.x

jobs:
  static-analysis-phpstan:
    name: "Static Analysis with PHPStan"
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
        php-version: [ '8.2', '8.4' ]
        include:
          - php-version: '8.4'
            composer-flags: '--ignore-platform-req=php+'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}
          tools: composer:v2, cs2pr

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-

      - name: Install dependencies with Composer
        run: |
          composer update --no-interaction --prefer-dist --no-progress ${{ matrix.composer-flags }}

      - name: Run a static analysis with phpstan/phpstan
        run: |
          vendor/bin/phpstan analyse --error-format=checkstyle | cs2pr

  static-analysis-psalm:
    name: "Static Analysis with Psalm"
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
        php-version: [ '8.2', '8.4' ]
        include:
          - php-version: '8.4'
            composer-flags: '--ignore-platform-req=php+'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-

      - name: Install dependencies with Composer
        run: |
          composer update --no-interaction --prefer-dist --no-progress ${{ matrix.composer-flags }}

      - name: Run a static analysis with vimeo/psalm
        run: |
          vendor/bin/psalm --output-format=github
